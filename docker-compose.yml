services:
  claude:
    image: ghcr.io/emilw/agent-container:latest
    container_name: claude
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - ./config:/config          # agent.env (Telegram etc.) + claude/ (login, settings, history)
      - /volume1/code:/workspace  # change to your repos folder on the NAS
