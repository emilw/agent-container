name: Build and publish image

on:
  pull_request: # build only, to check the image still builds
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # weekly, picks up new Claude Code releases
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Claude Code version
        id: ver
        run: echo "version=$(npm view @anthropic-ai/claude-code version)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Build the image for this runner first and check that the tools API it serves is
      # still compatible with api/openapi.baseline.json, before anything is published.
      - name: Build an image to test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: agent-container:ci
          build-args: CLAUDE_CODE_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha

      - name: Check the tools API stays backwards compatible
        run: |
          docker run -d --name api-check agent-container:ci
          for i in $(seq 30); do
            docker exec api-check curl -sf http://127.0.0.1:7777/openapi.json > openapi.json && break
            sleep 2
          done
          docker rm -f api-check >/dev/null
          node scripts/check-api.mjs openapi.json

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: CLAUDE_CODE_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
